[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contour-shape-classifier"
version = "1.0.0"
description = "Shape classification from image contours, from scratch (NumPy + Pillow + SciPy) — triangle/square/rectangle/pentagon/circle/ellipse, no OpenCV."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "Pillow>=10",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
contour-shapes = "contour_shapes.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
